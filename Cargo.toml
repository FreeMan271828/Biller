[package]
name = "biller"
version = "1.5.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-native-tls", "chrono", "macros", "sqlite", "any"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
dotenvy = "0.15"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
# 用 ratatui 重导出的 crossterm（本机只缓存了 crossterm 0.29，故显式选该后端版本），
# 不再单独声明 crossterm，避免出现两个版本导致类型不匹配。
ratatui = { version = "0.30.2", features = ["crossterm_0_29"] }
serde_json = "1.0.154"
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rcgen = "0.14.10"
hudsucker = "0.25.0"
async-trait = "0.1.92"
http-body-util = "0.1.5"
